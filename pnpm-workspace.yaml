# Dependency supply-chain policy.
# Narrow exception for the verified security fix; the seven-day policy remains.
minimumReleaseAgeExclude:
  - source-map-js@1.2.2
minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: false
trustLockfile: false
strictDepBuilds: true
allowBuilds:
  esbuild: true
  fsevents: true
  sharp: true
  unrs-resolver: true
enableGlobalVirtualStore: false
# Reuse store files with clones or hardlinks before falling back to copies.
packageImportMethod: auto
# The explicit installer owns dependency setup, including restored workspaces.
verifyDepsBeforeRun: false
optimisticRepeatInstall: false
overrides:
  # Verified patch GHSA-wq5f-xc86-pv6w; keep the seven-day release policy.
  sharp: 0.35.5
  browserslist: 4.28.7
  source-map-js: 1.2.2
  baseline-browser-mapping: 2.11.0
  fast-uri: 3.1.8
  '@babel/core': 7.29.6
  react-server-dom-webpack: 19.2.8
  'brace-expansion@>=1.0.0 <2.0.0': 1.1.21
  'brace-expansion@>=4.0.0 <6.0.0': 5.0.12
  'undici@>=7.0.0 <8.0.0': 7.29.1
  'ws@>=8.0.0 <9.0.0': 8.21.0
  'js-yaml@>=4.0.0 <5.0.0': 4.3.2
  'image-size@>=2.0.0 <3.0.0': 2.0.3
  'fflate@>=0.7.0 <0.8.0': 0.7.5
  'esbuild@>=0.25.0 <0.29.0': 0.28.1
